<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Escapa de Remigia</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120a05; touch-action: none; -webkit-user-select: none; user-select: none; }
  #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #120a05; outline: none; }
  #carga { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
           background: radial-gradient(circle at 50% 40%, #3a2214 0%, #120a05 72%); color: #f1d9a0; font-family: Georgia, 'Times New Roman', serif; transition: opacity .45s; }
  #carga h1 { margin: 0; font-size: clamp(22px, 5vw, 40px); letter-spacing: .08em; color: #f5c542; text-align: center; text-shadow: 0 2px 10px #000; }
  #carga p { margin: 0; font-size: 14px; opacity: .85; font-style: italic; }
  #barra { width: min(320px, 70vw); height: 14px; border: 2px solid #d4af37; border-radius: 10px; overflow: hidden; background: #1d120a; box-shadow: 0 0 18px rgba(212,175,55,.25); }
  #relleno { height: 100%; width: 0; background: linear-gradient(90deg, #8c6008, #f5d061); transition: width .15s; }
  #error { display: none; color: #fca5a5; max-width: 80vw; text-align: center; font-size: 14px; font-family: sans-serif; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="carga">
  <h1>ESCAPA DE REMIGIA</h1>
  <div id="barra"><div id="relleno"></div></div>
  <p>Cargando la Buenos Aires de 1810…</p>
  <div id="error"></div>
</div>
<script>
(function () {
  var canvas = document.getElementById('unity-canvas');
  var carga = document.getElementById('carga');
  var relleno = document.getElementById('relleno');
  var instancia = null, pendiente = null;

  function enviar(metodo) {
    if (instancia) { try { instancia.SendMessage('Juego', metodo); } catch (e) {} }
    else pendiente = metodo;
  }

  // La página principal avisa cuando se sale de la pestaña del juego ('pause') o se vuelve ('resume').
  window.addEventListener('message', function (e) {
    if (e.data === 'pause') enviar('PausarDesdeWeb');
    else if (e.data === 'resume') { enviar('ReanudarDesdeWeb'); canvas.focus(); }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) enviar('PausarDesdeWeb'); });
  canvas.addEventListener('pointerdown', function () { canvas.focus(); });

  var config = {
    dataUrl: "Build/EscapaDeRemigia.data.unityweb",
    frameworkUrl: "Build/EscapaDeRemigia.framework.js.unityweb",
    codeUrl: "Build/EscapaDeRemigia.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Escapa de Remigia",
    productName: "Escapa de Remigia",
    productVersion: "0.1.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.75)
  };

  var script = document.createElement('script');
  script.src = "Build/EscapaDeRemigia.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) { relleno.style.width = (100 * p) + '%'; })
      .then(function (u) {
        instancia = u;
        carga.style.opacity = '0';
        setTimeout(function () { carga.style.display = 'none'; }, 480);
        canvas.focus();
        if (pendiente) { enviar(pendiente); pendiente = null; }
      })
      .catch(function (m) {
        var e = document.getElementById('error');
        e.style.display = 'block';
        e.textContent = 'No se pudo cargar el juego: ' + m;
      });
  };
  script.onerror = function () {
    var e = document.getElementById('error');
    e.style.display = 'block';
    e.textContent = 'No se encontraron los archivos del juego (carpeta Build). Si abriste la página con doble clic, necesita estar publicada en un servidor web.';
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
